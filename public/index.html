<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Melon Agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Melon Agent</h1>
          <p id="active-module-description">先选择功能模块，再发送任务指令。</p>
        </div>
        <span class="status-pill">Online</span>
      </header>

      <nav class="module-nav" aria-label="功能模块">
        <div id="module-list" class="module-list">
          <button class="module-button is-active" type="button" data-module-id="album_source">专辑音源</button>
          <button class="module-button" type="button" data-module-id="melon_identity">melon实名</button>
          <button class="module-button" type="button" data-module-id="single_source">单曲音源</button>
        </div>
      </nav>

      <section id="messages" class="messages" aria-live="polite">
        <article class="message assistant">
          <div class="avatar">M</div>
          <div class="message-body">
            <p>当前模块：专辑音源。可以输入：给我 tws 最新专辑的全曲源码。</p>
          </div>
        </article>
      </section>

      <section id="identity-history" class="identity-history" aria-label="melon实名历史记录" hidden>
        <div class="identity-history-head">
          <div>
            <strong>近 3 天记录</strong>
            <span>点名字或模版复制</span>
          </div>
          <button id="identity-history-close" class="identity-history-close" type="button">收起</button>
        </div>
        <div id="identity-history-list" class="identity-history-list"></div>
      </section>

      <section id="single-source-tools" class="tool-cards" aria-label="单曲音源正则工具" hidden></section>

      <form id="chat-form" class="composer">
        <button id="identity-history-toggle" class="history-toggle-button" type="button" hidden>记录</button>
        <label class="sr-only" for="message-input">消息</label>
        <textarea id="message-input" rows="1" placeholder="输入 Melon 相关任务..." autocomplete="off"></textarea>
        <button id="send-button" type="submit">发送</button>
      </form>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
